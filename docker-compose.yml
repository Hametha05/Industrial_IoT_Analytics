services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: industrial_iot
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  consumer:
    build: .
    command: python -m consumer.mqtt_consumer
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MQTT_HOST: mqtt
    depends_on:
      - postgres
      - redis
      - mqtt
    volumes:
      - ./data/csv:/app/data/csv

  simulator:
    build: .
    command: python -m simulator.machine_simulator
    environment:
      MQTT_HOST: mqtt
    depends_on:
      - mqtt

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: